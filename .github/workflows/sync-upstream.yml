name: 自动同步上游

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动同步
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许手动触发

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 同步上游 zc-zhangchen/any-auto-register
        run: |
          echo "🔄 开始同步上游仓库..."
          git remote add upstream https://github.com/zc-zhangchen/any-auto-register.git || true
          git fetch upstream

          echo "📊 上游新提交："
          git log --oneline main..upstream/main | head -20 || echo "无新提交"

          # 检查是否有新提交
          if [ "$(git rev-parse main)" = "$(git merge-base main upstream/main)" ] && [ "$(git rev-parse upstream/main)" = "$(git rev-parse main)" ]; then
            echo "✅ 已是最新，无需同步"
            exit 0
          fi

          echo "🔀 合并上游代码..."
          if git merge upstream/main --no-edit; then
            echo "✅ 合并成功"
            git push origin main
            echo "🚀 已推送到 GitHub"
          else
            echo "❌ 合并失败，可能有冲突"
            git merge --abort
            exit 1
          fi

      - name: 生成同步报告
        if: success()
        run: |
          {
            echo "## ✅ 同步成功"
            echo ""
            echo "**上游仓库**: zc-zhangchen/any-auto-register"
            echo "**同步时间**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "### 最近提交"
            echo '```'
            git log --oneline HEAD~5..HEAD 2>/dev/null || git log --oneline HEAD -5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 同步失败通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().split('T')[0];
            const body = [
              '## 同步失败报告',
              '',
              `**失败时间**: ${new Date().toISOString()}`,
              `**Workflow 运行**: ${runUrl}`,
              '',
              '### 可能原因',
              '',
              '- `main` 分支的自定义补丁与上游代码冲突',
              '- 上游仓库暂时不可访问',
              '- 上游出现了大规模重构 / 文件重命名',
              '',
              '### 建议操作',
              '',
              `1. 查看 [Actions 日志](${runUrl}) 了解详细错误`,
              '2. 本地手动解决冲突：',
              '   ```bash',
              '   cd ~/github/any-auto-register',
              '   git checkout main',
              '   git fetch upstream',
              '   git merge upstream/main',
              '   # 解决冲突后',
              '   git push origin main',
              '   ```'
            ].join('\n');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ 上游同步失败 - ${today}`,
              body,
              labels: ['sync-failure']
            });
